<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>HablaPY · Espanhol para viver no Paraguai</title>
<meta name="description" content="Aprenda espanhol para morar e estudar medicina no Paraguai, com uma professora de IA que conversa por voz e aulas ao vivo.">
<meta name="theme-color" content="#0f1b2d">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@400;600;700;800&display=swap">
<style>
:root{
  --bg:#eef2f6; --panel:#ffffff; --ink:#0f1b2d; --muted:#5b6778; --line:#dbe2ea;
  --univ:#c8102e; --univ-ink:#ffffff; --azul:#0038a8; --ok:#1e8a4c; --bad:#c0392b; --ouro:#c9962e;
  --stage1:#e6ecf5; --stage2:#cdd8e6;
  --font:"Nunito Sans","Segoe UI",Roboto,Arial,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.45}
button{font:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,a:focus-visible{outline:3px solid var(--azul);outline-offset:2px}

header{display:flex;align-items:center;gap:10px;padding:10px 16px;background:var(--ink);color:#fff;position:sticky;top:0;z-index:5}
.marca{display:flex;align-items:center;gap:10px;font-weight:800;font-size:18px;letter-spacing:.2px}
.marca .logo{width:32px;height:32px;border-radius:9px;background:linear-gradient(180deg,#c8102e 0 33%,#fff 33% 66%,#0038a8 66%);display:grid;place-items:center;font-size:15px}
.marca small{display:block;font-weight:600;font-size:12px;opacity:.75}
.espaco{flex:1}
.xp{font-weight:700;font-size:14px;background:rgba(255,255,255,.1);padding:7px 12px;border-radius:999px;white-space:nowrap}
.btn-vip{border:0;border-radius:999px;padding:7px 14px;font-weight:800;background:var(--ouro);color:#1b1300;min-height:36px}
.btn-vip.ativo{background:rgba(255,255,255,.12);color:#ffd77a}
.btn-idioma{border:1px solid rgba(255,255,255,.35);background:rgba(255,255,255,.1);color:#fff;border-radius:999px;padding:6px 12px;font-weight:800;min-height:36px;min-width:48px}
.btn-sair{border:1px solid rgba(255,255,255,.3);background:transparent;color:#fff;border-radius:999px;padding:6px 12px;font-weight:700;min-height:36px}

main{display:grid;grid-template-columns:minmax(320px,46%) 1fr;height:calc(100vh - 56px);height:calc(100dvh - 56px)}
.palco{position:relative;background:radial-gradient(ellipse at 50% 35%,var(--stage1),var(--stage2));overflow:hidden}
.prof{position:absolute;inset:0;z-index:2}
.prof-status{position:absolute;left:0;right:0;top:45%;text-align:center;font-weight:700;color:var(--muted);z-index:1;pointer-events:none}
.balao{position:absolute;left:16px;right:16px;bottom:128px;background:#fff;border:1px solid var(--line);border-radius:16px;padding:12px 14px;
  box-shadow:0 6px 20px rgba(15,27,45,.12);font-weight:600;max-height:34%;overflow:auto;z-index:4}
.balao .es{display:block;font-size:18px;color:var(--ink)}
.balao .pt{display:block;font-weight:600;color:var(--muted);margin-top:4px;font-size:15px}
.balao[hidden]{display:none}
.voz{position:absolute;left:50%;bottom:16px;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:6px;z-index:5}
.mic{width:76px;height:76px;border-radius:50%;border:0;background:var(--univ);color:#fff;display:flex;align-items:center;justify-content:center;box-shadow:0 8px 24px rgba(0,0,0,.3)}
.mic svg{width:34px;height:34px}
.mic[data-estado="ouvindo"]{background:#e39a72;animation:pulsa 1.2s ease-in-out infinite}
.mic[data-estado="pensando"]{opacity:.7}
@keyframes pulsa{0%,100%{box-shadow:0 0 0 0 rgba(227,154,114,.6)}50%{box-shadow:0 0 0 16px rgba(227,154,114,0)}}
.dica-voz{font-size:13px;font-weight:700;color:var(--ink);background:rgba(255,255,255,.85);border-radius:999px;padding:3px 10px}
.dica-voz:empty{display:none}

.btn{border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:12px;padding:9px 14px;font-weight:700;min-height:44px;display:inline-flex;align-items:center;gap:8px;text-decoration:none}
.btn.prim{background:var(--univ);border-color:var(--univ);color:var(--univ-ink)}
.btn.mini{min-height:36px;padding:6px 12px;font-size:14px}
.btn:disabled{opacity:.5;cursor:default}

.painel{overflow:auto;padding:18px 20px 40px;background:var(--panel)}
h2{font-size:21px;margin:8px 0 12px}
h3{font-size:14px;margin:20px 0 10px;color:var(--muted);text-transform:uppercase;letter-spacing:.6px}
.temas{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px}
.tema{position:relative;border:1px solid var(--line);background:#fff;border-radius:16px;padding:14px;text-align:left;display:flex;flex-direction:column;gap:4px;min-height:118px;transition:transform .15s,box-shadow .15s}
.tema:hover{transform:translateY(-2px);box-shadow:0 8px 20px rgba(15,27,45,.08)}
.tema .ic{font-size:28px}
.tema b{font-size:15px}
.tema .sub{font-size:12px;color:var(--muted);font-weight:600}
.tema .feito{font-size:12px;color:var(--ok);font-weight:800}
.tema.bloq{background:#fbf8f1}
.cadeado{font-size:12px;font-weight:800;color:#8a6a1c}

.abas{display:flex;gap:6px;border-bottom:1px solid var(--line);margin:8px 0 14px;overflow-x:auto}
.abas button{border:0;background:none;padding:10px 12px;font-weight:700;color:var(--muted);border-bottom:3px solid transparent;min-height:44px;white-space:nowrap}
.abas button[aria-selected="true"]{color:var(--ink);border-color:var(--univ)}
.pontos{margin:0;padding:0;list-style:none}
.pontos li{position:relative;padding:12px 64px 12px 14px;border:1px solid var(--line);border-radius:14px;margin-bottom:8px;cursor:pointer;transition:background .2s}
.pontos li .es{font-weight:800;font-size:17px}
.pontos li .pt{color:var(--muted)}
.pontos li .dica{font-size:13px;margin-top:6px;background:#fff7e6;border-radius:8px;padding:6px 8px}
.pontos li.atual{background:#eef4ff;border-color:#9db6ef}
.repetir{position:absolute;right:10px;top:10px;width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:#fff;font-size:20px}
.nota{position:absolute;right:12px;top:58px;font-size:12px;font-weight:800;color:var(--ok)}
.dica-uso{font-size:13px;color:var(--muted);margin:0 0 10px}
.linha-botoes{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.linha-botoes.topo{margin-top:0}

.pergunta{font-weight:800;font-size:18px;margin:4px 0 12px}
.opcoes{display:grid;gap:8px}
.opcao{text-align:left;border:1.5px solid var(--line);background:#fff;border-radius:12px;padding:12px 14px;font-weight:600;min-height:48px}
.opcao:disabled{color:var(--ink);cursor:default}
.opcao.certa{border-color:var(--ok);background:#eaf7ef}
.opcao.errada{border-color:var(--bad);background:#fdeeee}
.explica{margin-top:12px;padding:12px;border-radius:12px;background:var(--bg)}
.progresso{font-size:13px;color:var(--muted);font-weight:700}

.chat{display:flex;flex-direction:column;gap:8px;min-height:140px;margin-bottom:12px}
.msg{max-width:88%;padding:10px 12px;border-radius:14px}
.msg.eu{align-self:flex-end;background:var(--ink);color:#fff;border-bottom-right-radius:4px}
.msg.ia{align-self:flex-start;background:var(--bg);border-bottom-left-radius:4px}
.msg .es{font-weight:700}
.msg .pt{font-size:14px;color:var(--muted);margin-top:3px}
.msg .correcao{font-size:14px;margin-top:6px;background:#fff7e6;border-radius:8px;padding:6px 8px}
.aviso{font-size:14px;color:var(--muted);background:var(--bg);border-radius:10px;padding:9px 11px;margin:0 0 10px}
form.perg{display:flex;gap:8px}
form.perg input{flex:1;font:inherit;border:1px solid var(--line);border-radius:12px;padding:10px 12px;min-height:46px;min-width:0}

.campo{margin-bottom:14px}
.campo span{display:block;font-weight:700;font-size:14px;margin-bottom:6px}
.seg{display:flex;gap:8px;flex-wrap:wrap}
.opt{border:1.5px solid var(--line);background:#fff;border-radius:12px;padding:8px 14px;font-weight:700;min-height:44px}
.opt[aria-pressed="true"]{border-color:var(--ink);box-shadow:0 0 0 2px var(--ink) inset}
.campo input{width:100%;font:inherit;border:1px solid var(--line);border-radius:12px;padding:10px 12px;min-height:46px}

.preco{font-size:16px;color:var(--univ);margin-left:6px}
.beneficios{list-style:none;padding:0;margin:0 0 16px;display:grid;gap:8px}
.beneficios li{background:var(--bg);border-radius:12px;padding:10px 12px;font-weight:600}
.aulas{list-style:none;padding:0;margin:0;display:grid;gap:8px}
.aulas li{border:1px solid var(--line);border-radius:12px;padding:10px 12px;display:grid;gap:4px}
.aulas li span{color:var(--muted);font-size:14px}
.aulas li .btn{justify-self:start}
.msg-vip{font-weight:700;min-height:1.4em}
[hidden]{display:none!important}

@media (max-width:820px){
  main{grid-template-columns:1fr;grid-template-rows:48vh auto;height:auto}
  .palco{height:48vh;position:sticky;top:56px;z-index:2}
  .painel{padding:16px}
  .marca small,.xp{display:none}
  .balao{bottom:112px;font-size:14px;padding:9px 12px}
  .balao .es{font-size:16px}
  .mic{width:64px;height:64px}
}
@media (prefers-reduced-motion:reduce){.tema{transition:none}.mic[data-estado="ouvindo"]{animation:none}}
</style>
</head>
<body>
<header>
  <div class="marca">
    <div class="logo" aria-hidden="true">🗣️</div>
    <div>HablaPY<small id="lema">Espanhol para viver no Paraguai</small></div>
  </div>
  <div class="espaco"></div>
  <div class="xp" id="xp"></div>
  <button type="button" class="btn-idioma" id="btnIdioma" aria-label="Idioma">PT</button>
  <button type="button" class="btn-vip" id="btnVip">👑 VIP</button>
  <button type="button" class="btn-sair" id="btnTrocar" title="Mudar nome ou professor(a)">⚙️</button>
</header>

<main>
  <section class="palco" id="palco" aria-label="Professora 3D">
    <div id="prof" class="prof"><div class="prof-status" id="profStatus"></div></div>
    <div class="balao" id="balao" aria-live="polite" hidden></div>
    <div class="voz" id="voz">
      <button type="button" class="mic" id="mic" data-estado="pronto" aria-label="Falar">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="2" width="6" height="12" rx="3"/><path d="M5 10a7 7 0 0 0 14 0"/><path d="M12 17v4"/></svg>
      </button>
      <div class="dica-voz" id="dicaVoz" aria-live="polite"></div>
    </div>
  </section>
  <section class="painel" id="painel"></section>
</main>

<script>
// Diagnóstico: mostra na tela qualquer erro (no celular não há console)
(function(){
  function show(m){ var b = document.getElementById('balao'); if (b){ b.hidden = false; b.textContent = 'Erro: ' + m; } }
  window.addEventListener('error', function(e){ if (e && e.message) show(e.message + ' (' + String(e.filename || '').split('/').pop() + ':' + (e.lineno || '') + ')'); });
  window.addEventListener('unhandledrejection', function(e){ var r = e && e.reason; show(String((r && r.message) || r)); });
  setTimeout(function(){ if (!window.__smStarted){ show('o app não iniciou. Recarregue a página.'); } }, 20000);
})();
</script>
<script type="module" src="./src/app.js"></script>
</body>
</html>
