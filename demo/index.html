<body>
<header>
  <div class="marca">
    <div class="logo" aria-hidden="true">🗣️</div>
    <div>HablaPY<small id="lema">Espanhol para viver no Paraguai</small></div>
  </div>
  <div class="espaco"></div>
  <div class="xp" id="xp"></div>
  <button type="button" class="btn-idioma" id="btnIdioma" aria-label="Idioma">PT</button>
  <button type="button" class="btn-vip" id="btnVip">👑 VIP</button>
  <button type="button" class="btn-sair" id="btnTrocar" title="Mudar nome ou professor(a)">⚙️</button>
</header>

<main>
  <section class="palco" id="palco" aria-label="Professora 3D">
    <div id="prof" class="prof"><div class="prof-status" id="profStatus"></div></div>
    <div class="balao" id="balao" aria-live="polite" hidden></div>
    <div class="voz" id="voz">
      <button type="button" class="mic" id="mic" data-estado="pronto" aria-label="Falar">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="2" width="6" height="12" rx="3"/><path d="M5 10a7 7 0 0 0 14 0"/><path d="M12 17v4"/></svg>
      </button>
      <div class="dica-voz" id="dicaVoz" aria-live="polite"></div>
    </div>
  </section>
  <section class="painel" id="painel"></section>
</main>

<script>
// Diagnóstico: mostra na tela qualquer erro (no celular não há console)
(function(){
  function show(m){ var b = document.getElementById('balao'); if (b){ b.hidden = false; b.textContent = 'Erro: ' + m; } }
  window.addEventListener('error', function(e){ if (e && e.message) show(e.message + ' (' + String(e.filename || '').split('/').pop() + ':' + (e.lineno || '') + ')'); });
  window.addEventListener('unhandledrejection', function(e){ var r = e && e.reason; show(String((r && r.message) || r)); });
  setTimeout(function(){ if (!window.__smStarted){ show('o app não iniciou. Recarregue a página.'); } }, 20000);
})();
</script>
